# Планшеты кузни (doc/data-model.md §4, задача 9.1) — по web/forge/PRM_FORGE_HEARTOFTHEWILD_Level{1,2,3}.
# У каждой стихии 12 предметов в порядке планшета: 8 видов оружия (по одному на класс), шлем, доспех и
# 2 предмета. Названия одинаковы на всех уровнях, меняются только материи.
#
# cost — материи по уровням кузни [1-й, 2-й, 3-й], каждая единица отдельно: [BLOOD, BLOOD] — 2 крови.
# Кроме материй, создание стоит 1 стихию кузни (правила, «Кузня»). Коды материй — ResourceCode:
# SCALES чешуя, BONES кости, BLOOD кровь, ZIMIA зимия, IRIDIA иридия, ZLATIA златия.
#
# slot — ForgeSlot: оружие класса (GREATSWORD Дареон, GREATBOW Мира, HAMMER Торег, SWORD_AND_SHIELD Льонар,
# DUAL_BLADES Кара, GUN Хелерен, SPEAR Зарайа, DRUM Друск), HELMET, ARMOR, ITEM.

