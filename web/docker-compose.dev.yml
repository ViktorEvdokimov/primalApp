# Инфраструктура для разработки: бэкенд и фронтенд запускаются из IDE (doc/setup.md, раздел 4).
# Запуск: docker compose -f docker-compose.dev.yml up -d
name: primal-dev

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: primal
      POSTGRES_USER: primal
      POSTGRES_PASSWORD: primal
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - primal-dev-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U primal -d primal"]
      interval: 5s
      timeout: 3s
      retries: 10

  mailpit:
    image: axllent/mailpit
    ports:
      - "127.0.0.1:1025:1025"   # SMTP
      - "127.0.0.1:8025:8025"   # веб-интерфейс и HTTP API
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  primal-dev-db:
