# E2E-тесты сайта: полный стек в Docker (Caddy, бэкенд, PostgreSQL, Mailpit) и pytest + Playwright в web/e2e.
name: web-e2e

on:
  push:
    paths: ['web/**', '.github/workflows/web-e2e.yml']
  pull_request:
    paths: ['web/**', '.github/workflows/web-e2e.yml']

permissions:
  contents: read

concurrency:
  group: web-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      # Настройки для локального стека: секреты-примеры допустимы по HTTP, лимиты увеличены для E2E
      - name: Стек сайта
        run: |
          cp .env.example .env
          docker compose --profile local up -d --build --wait

      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Зависимости тестов
        working-directory: web/e2e
        run: |
          pipx install poetry
          poetry install --no-root
          poetry run playwright install --with-deps chromium

      - name: E2E
        working-directory: web/e2e
        run: poetry run pytest

      - name: Отчёт Allure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: web/e2e/allure-results/
          if-no-files-found: ignore

      - name: Логи стека
        if: failure()
        run: docker compose --profile local logs --no-color > stack.log

      - name: Логи стека (артефакт)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: stack-logs
          path: web/stack.log
