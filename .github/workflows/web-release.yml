# Образы сайта для сервера: по тегу web-v* собираются и публикуются в GHCR
# (ghcr.io/<владелец>/primal-backend и primal-web). На слабом сервере их скачивают, а не собирают
# (doc/setup.md, раздел 3.9).
name: web-release

on:
  push:
    tags: ['web-v*']

permissions:
  contents: read
  packages: write

jobs:
  images:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        image:
          - { name: primal-backend, context: web/backend }
          - { name: primal-web, context: web/frontend }
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Имя образа
        id: name
        run: echo "repo=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${{ matrix.image.name }}" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.image.context }}
          push: true
          tags: |
            ${{ steps.name.outputs.repo }}:${{ github.ref_name }}
            ${{ steps.name.outputs.repo }}:latest
          cache-from: type=gha,scope=${{ matrix.image.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image.name }}
